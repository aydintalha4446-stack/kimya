<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimya Laboratuvarı Bilgi Yarışması</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: var(--accent-color); }
        .question-img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #334155;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        button.option-btn {
            background-color: #334155;
            color: var(--text-color);
            border: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button.option-btn:hover { background-color: #475569; transform: translateY(-2px); }
        button.option-btn.correct { background-color: var(--success-color); }
        button.option-btn.wrong { background-color: var(--error-color); }
        #feedback { margin-top: 1rem; font-weight: bold; min-height: 1.5rem; }
        .hidden { display: none; }
        #next-btn {
            margin-top: 1.5rem;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kimya Lab Araçları Testi</h1>
        <div id="quiz-box">
            <img id="q-image" class="question-img" src="" alt="Lab Cihazı">
            <p id="q-text" style="margin-bottom: 1rem; font-weight: 500;"></p>
            <div class="options" id="options-container"></div>
        </div>
        <div id="feedback"></div>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">Sonraki Soru</button>
    </div>

    <script>
        const quizData = [
            {
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Beakers.jpg/640px-Beakers.jpg",
                question: "Görselde verilen laboratuvar malzemesinin adı nedir?",
                options: ["Beherglas (Beaker)", "Balon Joje"],
                answer: 0
            },
            {
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Volumetric_Flasks.jpg/640px-Volumetric_Flasks.jpg",
                question: "Bu hassas ölçüm ve çözelti hazırlama cam malzemesi hangisidir?",
                options: ["Erlenmayer", "Balon Joje"],
                answer: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuiz() {
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-btn").classList.add("hidden");
            
            const currentQ = quizData[currentQuestion];
            document.getElementById("q-image").src = currentQ.image;
            document.getElementById("q-text").innerText = currentQ.question;

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, buttonElement) {
            const currentQ = quizData[currentQuestion];
            const buttons = document.querySelectorAll(".option-btn");
            
            // Tüm butonları devre dışı bırak
            buttons.forEach(b => b.onclick = null);

            if (selectedIndex === currentQ.answer) {
                buttonElement.classList.add("correct");
                document.getElementById("feedback").innerText = "Tebrikler, Doğru! 🎉";
                document.getElementById("feedback").style.color = "var(--success-color)";
                score++;
            } else {
                buttonElement.classList.add("wrong");
                buttons[currentQ.answer].classList.add("correct");
                document.getElementById("feedback").innerText = "Yanlış cevap! ❌";
                document.getElementById("feedback").style.color = "var(--error-color)";
            }

            if (currentQuestion < quizData.length - 1) {
                document.getElementById("next-btn").classList.remove("hidden");
            } else {
                setTimeout(() => {
                    document.getElementById("quiz-box").innerHTML = `<h2>Test Bitti!</h2><p>Toplam Skorun: ${score} / ${quizData.length}</p>`;
                    document.getElementById("feedback").innerText = "Harika iş çıkardın!";
                }, 1000);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuiz();
        }

        loadQuiz();
    </script>
</body>
</html>
